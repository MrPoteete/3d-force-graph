<style>
/* Layout: one full-bleed 3D canvas; floating instrument panels (dials left, reader right, search top). Single dark world. */
:root {
  --ink: #e6e9f2;
  --ink-dim: #9aa3b8;
  --panel: rgba(14, 17, 28, 0.86);
  --panel-solid: #0e111c;
  --line: rgba(160, 176, 220, 0.18);
  --accent: #8fb8ff;
  --warn: #ff7a6b;
  --f-display: "Unbounded", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: #05060b; color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
.chrome { position: fixed; z-index: 5; }
#brand {
  top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--f-display); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
  pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.8);
}
#brand small { display: block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.02em; text-transform: none; color: var(--ink-dim); margin-top: 4px; }
#searchWrap { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); width: min(380px, calc(100vw - 32px)); }
#search {
  width: 100%; box-sizing: border-box; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: 14px var(--f-body); backdrop-filter: blur(8px);
}
#search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#suggest { margin: 4px 0 0; padding: 4px; list-style: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; max-height: 50vh; overflow-y: auto; }
#suggest li { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
#suggest li[aria-selected="true"], #suggest li:hover { background: rgba(143,184,255,.14); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
/* lil-gui sits top-right */
.lil-gui.root { top: calc(env(safe-area-inset-top, 0px) + 12px) !important; right: max(12px, env(safe-area-inset-right, 0px)) !important; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  --background-color: rgba(14,17,28,.92); --widget-color: #232a3d; --hover-color: #2d3550; --focus-color: #36406a; --number-color: #9fd0ff; --string-color: #c8e6a0; --font-family: var(--f-body); --font-family-mono: var(--f-mono); --title-background-color: #161b2b; --width: 300px; }
#reader {
  left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(380px, calc(100vw - 32px)); max-height: min(70vh, calc(100% - 120px)); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px);
  padding: 16px 18px; box-sizing: border-box; display: grid; gap: 12px;
}
#reader h2 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 17px; line-height: 1.3; text-wrap: balance; padding-right: 28px; }
#reader .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 11.5px var(--f-mono); color: var(--ink-dim); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink); font: 11.5px var(--f-mono); }
.chip.warn { border-color: rgba(255,122,107,.5); color: var(--warn); }
#reader p.sum { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
#reader h3 { margin: 4px 0 0; font: 600 10.5px var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
#reader ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#reader li button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; font-size: 13.5px; }
#reader li button:hover, #reader li button:focus-visible { background: rgba(143,184,255,.12); }
#reader li.src { font: 11.5px var(--f-mono); color: var(--ink-dim); padding: 2px 6px; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); font: 500 12.5px var(--f-body); color: var(--ink); }
.btn:hover, .btn:focus-visible { background: rgba(143,184,255,.12); }
.btn[aria-pressed="true"] { background: rgba(143,184,255,.22); border-color: var(--accent); }
#closeReader { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; font-size: 16px; }
.lbl { font: 500 12.5px var(--f-body); white-space: nowrap; text-shadow: 0 0 4px #000, 0 1px 3px #000, 0 0 10px rgba(0,0,0,.8); pointer-events: none; letter-spacing: .01em; }
.lbl.sel { font-weight: 600; }
.lbl.sat { font-family: var(--f-mono); opacity: .9; }
#tip { position: fixed; z-index: 6; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 11.5px var(--f-mono); color: var(--ink); max-width: 320px; overflow-wrap: anywhere; }
.scene-tooltip { font-family: var(--f-body) !important; font-size: 13px !important; background: rgba(14,17,28,.9); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
#modal .box { width: min(520px, 100%); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
#modal h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 15px; }
#modal p { margin: 0; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
#modal textarea { width: 100%; box-sizing: border-box; height: 180px; background: #070910; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 11.5px var(--f-mono); padding: 8px; }
#toast { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--panel-solid); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 14px; font-size: 13px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 13px var(--f-mono); color: var(--ink-dim); }
@media (max-width: 640px) {
  .lil-gui.root { --width: calc(100vw - 32px); left: max(16px, env(safe-area-inset-left, 0px)) !important; right: auto !important; max-height: 70vh; }
  #brand { display: none; }
  #searchWrap { top: calc(env(safe-area-inset-top, 0px) + 54px); }
  #reader { max-height: 45vh; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/+esm';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/UnrealBloomPass.js/+esm';
import { CSS2DRenderer, CSS2DObject } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/renderers/CSS2DRenderer.js/+esm';
import ForceGraph3D from 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/+esm';

const RAW = JSON.parse(document.getElementById('wiki-data').textContent);
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

// ---------- data ----------
const nodes = RAW.pages.map(p => ({
  id: p.id, title: p.t, cat: p.c, domain: (p.d && p.d[0]) || 'none', summary: p.s, updated: p.u, bytes: p.b,
  sys: p.sys, hub: p.r === 'star', flags: p.f || [], gx: p.x, gy: p.y, gz: p.z, x: p.x, y: p.y, z: p.z,
  sources: p.src.map(([path, ext]) => ({ path, ext: !!ext })),
}));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = RAW.links.map(([s, t]) => ({ source: s, target: t }));
const outN = new Map(), inN = new Map();
nodes.forEach(n => { outN.set(n.id, new Set()); inN.set(n.id, new Set()); });
links.forEach(l => { outN.get(l.source).add(l.target); inN.get(l.target).add(l.source); });
nodes.forEach(n => { n.nIn = inN.get(n.id).size; n.nOut = outN.get(n.id).size; n.nAll = new Set([...inN.get(n.id), ...outN.get(n.id)]).size; });
const genT = Date.parse(RAW.gen);
nodes.forEach(n => { n.ageDays = Math.max(0, (genT - Date.parse(n.updated + 'T00:00:00Z')) / 864e5) || 0; });
const catsByCount = [...nodes.reduce((m, n) => m.set(n.cat, (m.get(n.cat) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1]).map(e => e[0]);
const domainsByCount = [...nodes.reduce((m, n) => m.set(n.domain, (m.get(n.domain) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1]).map(e => e[0]);
$('stats').textContent = `${nodes.length} pages · ${links.length} links · exported ${RAW.gen.slice(0, 10)}`;

const PALETTES = {
  Vivid:  ['#4cc9f0','#f72585','#ffd166','#06d6a0','#b388ff','#ff8c42','#90e0ef','#ef476f','#c5f277','#f4a261','#a0c4ff','#ffadad'],
  Pastel: ['#a3c4f3','#ffb5c2','#fde4a5','#b9e8c8','#cdb4db','#ffcfa8','#bde0fe','#f1c0e8','#d8f3a6','#e9c8a6','#c6d8ff','#ffd6d6'],
  Neon:   ['#00f0ff','#ff2bd6','#fff200','#39ff14','#bf5bff','#ff7b00','#00ffa3','#ff3860','#d4ff00','#ffb000','#5c9dff','#ff6ec7'],
  Ember:  ['#ffb347','#ff6f59','#ffd27f','#e85d75','#f7a072','#c9485b','#ffe3a3','#ff9a8b','#d6a2ad','#f2c57c','#b5838d','#ffcdb2'],
  Ice:    ['#cfe8ff','#8fb8ff','#5ad1e6','#b7f0ff','#7f9cf5','#a5f3fc','#dbeafe','#67e8f9','#93c5fd','#c7d2fe','#e0f2fe','#a7f3d0'],
};

// ---------- settings ----------
const DEFAULTS = {
  // nodes
  shape: 'Sphere', material: 'Glossy', sizeBy: 'Links (all)', sizeScale: 1.0, sizeMin: 2.5, sizeMax: 14,
  colorBy: 'Category', palette: 'Vivid', recentColor: '#7df9ff', oldColor: '#3a4466', recencyDays: 60,
  nodeOpacity: 1.0, nodeGlow: true, glowSize: 3.0, glowStrength: 0.38, hubsShine: true, healthRings: true,
  // labels
  labels: 'Hubs + focus', labelTop: 12, labelSize: 1.0, labelColor: '#e8ecff',
  // links
  linkWidth: 0.35, linkOpacity: 0.28, linkColorMode: 'Source colour', linkColor: '#7d8bb5', linkCurve: 0.12,
  linkArrows: false, linkVisibility: 'All', particles: 'Focus only', particleCount: 3, particleSpeed: 0.006, particleSize: 1.6,
  // mood
  background: '#04050b', bloom: 0.75, bloomRadius: 0.4, bloomThreshold: 0.42, fog: 0.0005, stars: true, starCount: 2500, starSize: 1.4,
  ambient: 2.6, autoRotate: false, rotateSpeed: 0.4,
  // layout
  layout: 'Force', charge: -60, linkDistance: 38, clusterPull: 0.25, centerPull: 0.02, galaxySpread: 1.0,
  // focus
  focusDepth: 1, dimOthers: 0.12, flyDistance: 170, flyMs: 1200,
  // satellites
  satellites: true, satSize: 6, satOrbit: 1.0, satSpin: 0.25, satRaw: '#2fa8ff', satExt: '#ff9d1c', satLabels: false,
};
const PRESETS = {
  Nebula: {},
  Blueprint: { background: '#0b1d3a', palette: 'Ice', material: 'Wireframe', shape: 'Icosahedron', nodeGlow: false, bloom: 0.25, linkColorMode: 'Fixed', linkColor: '#cfe8ff', linkOpacity: 0.35, linkWidth: 0, linkCurve: 0, stars: false, fog: 0, labelColor: '#ffffff', labels: 'Hubs + focus' },
  Neural: { background: '#000000', palette: 'Neon', material: 'Glow', nodeGlow: true, glowSize: 4, glowStrength: 0.7, bloom: 1.4, bloomRadius: 0.7, linkColorMode: 'Source colour', linkOpacity: 0.18, linkCurve: 0.3, particles: 'All', particleCount: 1, particleSpeed: 0.004, stars: false },
  Embers: { background: '#120806', palette: 'Ember', material: 'Matte', bloom: 1.1, linkColorMode: 'Fixed', linkColor: '#ff9a6b', linkOpacity: 0.16, stars: true, starCount: 1200, fog: 0.0016 },
  Paper: { background: '#f2efe6', palette: 'Vivid', material: 'Matte', nodeGlow: false, bloom: 0, linkColorMode: 'Fixed', linkColor: '#4a4f63', linkOpacity: 0.3, stars: false, fog: 0, labelColor: '#1d2030', ambient: 3.6 },
  Quiet: { linkVisibility: 'Focus only', labels: 'Focus only', bloom: 0.6, particles: 'Off', sizeBy: 'Flat', sizeMin: 4, stars: true },
};
const catColorDefaults = (pal) => Object.fromEntries(catsByCount.map((c, i) => [c, PALETTES[pal][i % 12]]));
let S = { ...DEFAULTS, catColors: catColorDefaults(DEFAULTS.palette) };
const saved = store.get('orrery.current', null);
// A remembered satellite size that is an old default (2.2 in v1, 3.4 in v2-v3) was never chosen: take the new one.
if (saved && [2.2, 3.4].includes(saved.satSize)) delete saved.satSize;
if (saved) S = { ...S, ...saved, catColors: { ...S.catColors, ...(saved.catColors || {}) } };
const hiddenCats = new Set(store.get('orrery.hiddenCats', []));

// ---------- helpers ----------
const col = new THREE.Color();
function nodeColor(n) {
  if (S.colorBy === 'Category') return S.catColors[n.cat] || '#cccccc';
  const pal = PALETTES[S.palette];
  if (S.colorBy === 'Cluster') return pal[(n.sys ?? 0) % 12];
  if (S.colorBy === 'Domain') return pal[domainsByCount.indexOf(n.domain) % 12];
  const t = Math.min(1, n.ageDays / Math.max(1, S.recencyDays));
  return '#' + new THREE.Color(S.recentColor).lerp(new THREE.Color(S.oldColor), t).getHexString();
}
function sizeMetric(n) {
  switch (S.sizeBy) {
    case 'Links (all)': return n.nAll;
    case 'Linked from': return n.nIn;
    case 'Sources': return n.sources.length;
    case 'Page length': return n.bytes / 1000;
    default: return null;
  }
}
const metricMax = () => Math.max(1, ...nodes.map(n => sizeMetric(n) ?? 0));
let MMAX = 1;
function radius(n) {
  const m = sizeMetric(n);
  const r = m === null ? S.sizeMin : S.sizeMin + (S.sizeMax - S.sizeMin) * Math.sqrt(m / MMAX);
  return r * S.sizeScale;
}
const GEOS = {
  Sphere: new THREE.SphereGeometry(1, 28, 18), Icosahedron: new THREE.IcosahedronGeometry(1, 0),
  Crystal: new THREE.OctahedronGeometry(1, 0), Cube: new THREE.BoxGeometry(1.4, 1.4, 1.4), Dodecahedron: new THREE.DodecahedronGeometry(1, 0),
  Ring: new THREE.TorusGeometry(0.85, 0.28, 12, 32),
};
const ringGeo = new THREE.TorusGeometry(1, 0.06, 8, 48);
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,.55)'); gr.addColorStop(0.5, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
let labelObjs = [];
// A rebuilt scene can keep old label objects alive for a frame; point them at one shared empty div so their text cannot linger.
const deadLabel = document.createElement('div');
function clearLabels() { for (const o of labelObjs) { o.element.remove(); o.element = deadLabel; } labelObjs = []; }
function labelSprite(text, color, scale, cls = '') {
  const el = document.createElement('div');
  el.className = 'lbl ' + cls; el.textContent = text;
  el.style.color = color; el.style.fontSize = (12.5 * scale).toFixed(1) + 'px';
  const o = new CSS2DObject(el); o.center.set(0.5, 1.15); labelObjs.push(o);
  return o;
}
function makeMaterial(color, opacity) {
  const transparent = opacity < 1;
  switch (S.material) {
    case 'Matte': return new THREE.MeshLambertMaterial({ color, transparent, opacity });
    case 'Glow': return new THREE.MeshBasicMaterial({ color, transparent, opacity });
    case 'Wireframe': return new THREE.MeshBasicMaterial({ color, wireframe: true, transparent, opacity });
    default: return new THREE.MeshStandardMaterial({ color, roughness: 0.32, metalness: 0.15, emissive: color, emissiveIntensity: 0.18, transparent, opacity });
  }
}

// ---------- selection state ----------
let selected = null; const focusSet = new Set(); const focusLinks = new Set();
function computeFocus() {
  focusSet.clear(); focusLinks.clear();
  if (!selected) return;
  let frontier = [selected.id]; focusSet.add(selected.id);
  for (let d = 0; d < S.focusDepth; d++) {
    const next = [];
    for (const id of frontier) for (const nb of [...outN.get(id), ...inN.get(id)]) if (!focusSet.has(nb)) { focusSet.add(nb); next.push(nb); }
    frontier = next;
  }
  for (const l of links) { const s = l.source.id ?? l.source, t = l.target.id ?? l.target; if (focusSet.has(s) && focusSet.has(t)) focusLinks.add(l); }
}
const isVisibleNode = (n) => !hiddenCats.has(n.cat);
const topLabelIds = () => new Set([...nodes].sort((a, b) => b.nAll - a.nAll).slice(0, S.labelTop).map(n => n.id));
let TOP = new Set();
function showLabel(n) {
  switch (S.labels) {
    case 'Off': return false;
    case 'All': return true;
    case 'Focus only': return focusSet.has(n.id);
    default: return TOP.has(n.id) || focusSet.has(n.id);
  }
}

// ---------- node objects ----------
function buildNode(n) {
  const grp = new THREE.Group();
  const r = radius(n); n._r = r;
  const dim = selected && !focusSet.has(n.id);
  const op = (dim ? S.dimOthers : 1) * S.nodeOpacity;
  const c = nodeColor(n);
  const mesh = new THREE.Mesh(GEOS[S.shape] || GEOS.Sphere, makeMaterial(c, op));
  mesh.scale.setScalar(r); grp.add(mesh);
  if (S.nodeGlow && op > 0.05) {
    const strength = S.glowStrength * (S.hubsShine && n.hub ? 1.35 : 1) * (dim ? S.dimOthers : 1);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: c, transparent: true, opacity: Math.min(1, strength), blending: THREE.AdditiveBlending, depthWrite: false }));
    const gs = r * S.glowSize * (S.hubsShine && n.hub ? 1.2 : 1); sp.scale.set(gs, gs, 1); grp.add(sp);
  }
  if (S.healthRings && n.flags.length) {
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: '#ff6b5b', transparent: true, opacity: dim ? 0.15 : 0.85 }));
    ring.scale.setScalar(r * 1.6); ring.rotation.x = Math.PI / 2.4; grp.add(ring);
  }
  if (n === selected) {
    const sel = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.9 }));
    sel.scale.setScalar(r * 2.1); sel.userData.spin = true; grp.add(sel); selRing = sel;
  }
  if (showLabel(n) && !dim) {
    const ls = labelSprite(n.title, S.labelColor, S.labelSize * (n === selected ? 1.25 : 1), n === selected ? 'sel' : '');
    ls.position.set(0, -r, 0); grp.add(ls);
  }
  return grp;
}
let selRing = null;

// ---------- graph ----------
const stage = $('stage');
const cssRenderer = new CSS2DRenderer();
cssRenderer.domElement.style.pointerEvents = 'none';
const Graph = new ForceGraph3D(stage, { controlType: 'orbit', extraRenderers: [cssRenderer] })
  .showNavInfo(false)
  .nodeId('id')
  .nodeLabel(n => `<b>${escapeHtml(n.title)}</b><br><span style="opacity:.7">${n.cat} · ${n.nAll} links</span>`)
  .nodeThreeObject(buildNode)
  .nodeVisibility(isVisibleNode)
  .linkVisibility(l => isVisibleNode(l.source) && isVisibleNode(l.target) && (S.linkVisibility === 'All' || (S.linkVisibility === 'Focus only' && focusLinks.has(l))))
  .onNodeClick(n => select(n, true))

let clusterNodes = [];
function clusterForce(alpha) {

  const list = selected.sources, N = list.length; if (!N) return;
  const R = satOrbitRadius(selected);
  const ga = Math.PI * (3 - Math.sqrt(5));
  list.forEach((s, i) => {
    const y = N === 1 ? 0 : 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y * y), th = ga * i;
    const sc = s.ext ? S.satExt : S.satRaw;

}
